# Manual deploy to GitHub Pages. No build step: the repo is the site.
#
# Pages is set to "Deploy from a branch" (main, / root), so GitHub's built-in
# "pages build and deployment" workflow already publishes every push to main.
# This workflow must NOT also run on push: two deployments of one commit into the same
# Pages site collide and both fail ("Deployment failed, try again later").
#
# To deploy from here instead: Settings -> Pages -> Source: "GitHub Actions", then add
#   push: { branches: [main] }
# under `on:` below. Re-running a failed job is safe: each attempt uploads an artifact
# with its own name, so deploy never finds two artifacts called "github-pages".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html 404.html about assets _site/
      - name: Name the artifact
        id: artifact
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then name=github-pages; else name="github-pages-$GITHUB_RUN_ATTEMPT"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: ${{ steps.artifact.outputs.name }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ steps.artifact.outputs.name }}
